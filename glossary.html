<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Word-Part Glossary · First Volo Morphology</title>
  <link
    rel="stylesheet"
    href="glossary.css?v=20260826-glossary1"
  >
</head>

<body>
  <main class="glossary-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">First Volo Morphology</p>
        <h1>Word-Part Glossary</h1>
        <p class="intro">
          A reference for the prefixes, roots, and suffixes taught across Flights A, B, and C.
        </p>
      </div>

      <button
        id="printGlossaryButton"
        class="print-button"
        type="button"
      >
        Print / Save PDF
      </button>
    </header>

    <section
      class="controls"
      aria-label="Glossary filters"
    >
      <label>
        <span>Search</span>
        <input
          id="glossarySearch"
          type="search"
          placeholder="Word part, meaning, example…"
          autocomplete="off"
        >
      </label>

      <label>
        <span>Flight</span>
        <select id="flightFilter">
          <option value="all">All Flights</option>
          <option value="A">Flight A</option>
          <option value="B">Flight B</option>
          <option value="C">Flight C</option>
        </select>
      </label>

      <label>
        <span>Type</span>
        <select id="typeFilter">
          <option value="all">All Types</option>
          <option value="prefix">Prefixes</option>
          <option value="root">Roots</option>
          <option value="suffix">Suffixes</option>
        </select>
      </label>

      <label>
        <span>Sort</span>
        <select id="sortGlossary">
          <option value="flight">Flight</option>
          <option value="wordPart">Word Part</option>
          <option value="type">Type</option>
          <option value="meaning">Meaning</option>
        </select>
      </label>
    </section>

    <div class="summary-row">
      <p id="glossaryCount"></p>
      <button
        id="clearGlossaryFilters"
        class="clear-button"
        type="button"
      >
        Clear filters
      </button>
    </div>

    <section
      class="table-wrap"
      aria-label="Morphology glossary"
    >
      <table>
        <thead>
          <tr>
            <th scope="col">Tile</th>
            <th scope="col">Word Part</th>
            <th scope="col">Meaning</th>
            <th scope="col">Type</th>
            <th scope="col">Flight</th>
            <th scope="col">Examples</th>
          </tr>
        </thead>

        <tbody id="glossaryBody"></tbody>
      </table>
    </section>

    <p
      id="emptyGlossary"
      class="empty-message"
      hidden
    >
      No word parts match these filters.
    </p>
  </main>

  <script src="word-inventory.js?v=20260820-protect5"></script>
  <script src="token-sets.js"></script>
  <script src="glossary.js?v=20260826-glossary1"></script>
</body>
</html>
